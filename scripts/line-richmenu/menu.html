<!doctype html>
<!-- LINE 圖文選單底圖（2500×1686，2×2 四格）。改完重產 PNG：見同資料夾 upload.js 開頭說明 -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2500px; height: 1686px; overflow: hidden; background: #0f172a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px; padding: 24px; box-sizing: border-box; height: 100%; }
  .cell { position: relative; border-radius: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; color: #fff; }
  .cell svg.main { width: 380px; height: 380px; }
  .cell svg.badge { position: absolute; top: 56px; right: 64px; width: 150px; height: 150px; opacity: .55; }
  .label { font: 800 120px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 8px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .in { background: #16a34a; }
  .out { background: #ea580c; }
  .rec { background: #4f46e5; }
  .rev { background: #0891b2; }
</style>
<div class="grid">
  <!-- 左上：上班 -->
  <div class="cell in">
    <svg class="badge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="main" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
    <div class="label">IN</div>
  </div>
  <!-- 右上：下班 -->
  <div class="cell out">
    <svg class="badge" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
    <svg class="main" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <div class="label">OUT</div>
  </div>
  <!-- 左下：看打卡紀錄（月曆） -->
  <div class="cell rec">
    <svg class="main" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
    <div class="label">RECORDS</div>
  </div>
  <!-- 右下：看審核 -->
  <div class="cell rev">
    <svg class="main" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/></svg>
    <div class="label">REVIEW</div>
  </div>
</div>
